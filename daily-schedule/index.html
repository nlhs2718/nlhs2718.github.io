<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級功課表 - 內高廿柒屆雙語實驗班</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iansui/400.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <a href="../" class="logo">內高廿柒屆雙語實驗班</a>
        <ul>
            <li><a href="../">首頁</a></li>
        </ul>
    </nav>  

    <main class="schedule-page">
        <h2>課表 Class Schedule</h2>

        <div class="week-controls">
            <button id="prev-week" class="week-btn">上一週</button>
            <span id="week-display">載入中...</span>
            <button id="next-week" class="week-btn">下一週</button>
        </div>

        <p></br></p>
        
        <div class="table-container">
            <div id="loading-overlay" class="loading-box">
                <div class="spinner"></div>
                <p>課表載入中...</p>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>節次</th>
                        <th class="th-day"></th>
                        <th class="th-day"></th>
                        <th class="th-day"></th>
                        <th class="th-day"></th>
                        <th class="th-day"></th>
                    </tr>
                </thead>
                <tbody id="timetable-body">
                    <!-->
                    <!-->
                </tbody>
            </table>
        </div>
    </main>

    <script src="schedule.js"></script>
</body>
</html>
